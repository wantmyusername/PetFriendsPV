name: Deploy to cPanel (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inject pf-config.php from secret
        env:
          PF_SECRET: ${{ secrets.PF_SECRET }}
        run: |
          {
            echo '<?php'
            echo '// Generado automáticamente en el deploy. Vive solo en el servidor, no en el repo.'
            printf "\$PF_SECRET = '%s';\n" "$PF_SECRET"
          } > dist/pf-config.php

      - name: Deploy dist/ to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 50.31.188.8
          username: petfriends@petfriendspv.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
