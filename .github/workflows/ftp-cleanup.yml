name: FTP Cleanup (temp)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove mistakenly created nested folder
        env:
          FTP_USER: petfriends@petfriendspv.com
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, os
          ftp = ftplib.FTP("50.31.188.8", timeout=60)
          ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASSWORD"])

          def rm_tree(path):
              try:
                  names = ftp.nlst(path)
              except ftplib.error_perm:
                  return
              for name in names:
                  base = name.rsplit("/", 1)[-1]
                  if base in (".", ".."):
                      continue
                  full = f"{path}/{base}"
                  try:
                      ftp.cwd(full)
                      ftp.cwd("/")
                      rm_tree(full)
                  except ftplib.error_perm:
                      try:
                          ftp.delete(full)
                      except Exception as e:
                          print("  skip file", full, e)
              try:
                  ftp.rmd(path)
                  print("removed dir", path)
              except Exception as e:
                  print("  skip dir", path, e)

          rm_tree("public_html/petfriendspv.com")
          rm_tree("public_html")
          print("root listing after cleanup:")
          ftp.retrlines("LIST", print)
          ftp.quit()
          PY
