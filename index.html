  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #f0fdfa 0%, #ecfeff 30%, #fefce8 70%, #fff7ed 100%);
      padding: 2rem;
      position: relative;
      overflow-x: hidden;
    }

    /* decorative background shapes */
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      right: -20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0,145,161,0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -25%;
      left: -15%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0,145,161,0.06) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 680px;
      width: 100%;
    }

    .logo {
      margin-bottom: 2.5rem;
    }
    .logo img {
      height: 80px;
      width: auto;
      transition: transform 0.3s ease;
    }
    .logo img:hover {
      transform: scale(1.05);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0,145,161,0.1);
      color: #0091a1;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.5rem 1.2rem;
      border-radius: 100px;
      border: 1px solid rgba(0,145,161,0.2);
      margin-bottom: 1.8rem;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      background: #0091a1;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    h1 {
      font-family: 'Open Sans', sans-serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 800;
      line-height: 1.1;
      color: #1a1a2e;
      margin-bottom: 1rem;
    }
    h1 span {
      background: linear-gradient(135deg, #0091a1, #0abfbc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      color: #6b7280;
      line-height: 1.7;
      margin-bottom: 2.5rem;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      font-weight: 400;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    .social-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: white;
      color: #0091a1;
      border: 1px solid rgba(0,145,161,0.15);
      transition: all 0.3s ease;
      text-decoration: none;
    }
    .social-links a:hover {
      background: #0091a1;
      color: white;
      border-color: #0091a1;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,145,161,0.2);
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: #0091a1;
      color: white;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 1rem 2.2rem;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,145,161,0.25);
    }
    .cta-btn:hover {
      background: #007b8a;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,145,161,0.35);
    }
    .cta-btn:active {
      transform: translateY(0);
    }

    .paw-icon {
      width: 18px;
      height: 18px;
      filter: brightness(0) invert(1);
    }

    .footer-text {
      margin-top: 3.5rem;
      font-size: 0.75rem;
      color: #9ca3af;
      letter-spacing: 0.04em;
    }

    /* floating pets decoration */
    .floating-pets {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .floating-pets img {
      position: absolute;
      opacity: 0.06;
      animation: float 20s ease-in-out infinite;
    }
    .floating-pets img:nth-child(1) { top: 10%; left: 5%; width: 120px; animation-delay: 0s; }
    .floating-pets img:nth-child(2) { bottom: 15%; right: 8%; width: 100px; animation-delay: -5s; }
    .floating-pets img:nth-child(3) { top: 50%; left: 85%; width: 80px; animation-delay: -10s; }
    .floating-pets img:nth-child(4) { bottom: 30%; left: 3%; width: 90px; animation-delay: -15s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-20px) rotate(3deg); }
      75% { transform: translateY(10px) rotate(-2deg); }
    }

    @media (max-width: 480px) {
      body { padding: 1.5rem; }
      .logo img { height: 60px; }
    }
  </style>
</head>
